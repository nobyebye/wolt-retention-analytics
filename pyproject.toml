[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wolt-retention-analytics"
version = "1.0.0"
description = "Customer retention and repeat-purchase analytics with MySQL, data quality gates and interactive reporting"
requires-python = ">=3.11"
dependencies = ["PyMySQL[rsa]>=1.1,<2"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40,<2", "pandas>=2.2,<4", "plotly>=5.24,<8"]
test = ["pytest>=8,<10"]

[project.scripts]
wolt-analytics = "wolt_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires a disposable MySQL database"]
